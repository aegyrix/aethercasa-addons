name: 'AetherCasa Bridge'
version: '0.0.1'
slug: aethercasa_bridge
description: >-
  Connects your Home Assistant instance to AetherCasa. Streams entity state to
  your AetherCasa home and relays commands back. All control stays on your LAN;
  only entity state is forwarded.
url: https://aethercasa.com/docs
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
startup: services
boot: auto
# Bridge opens an outbound WSS to api.aethercasa.app. No ingress/port needed.
ingress: false
options:
  pairing_code: ''
  cloud_url: 'https://api.aethercasa.app'
  log_level: 'info'
schema:
  # Optional legacy pairing path; leave blank to use device-flow pairing.
  pairing_code: "match(^$|^\\d{6}$)"
  cloud_url: 'url'
  log_level: 'list(debug|info|warn|error)'
image: ghcr.io/aethercasa/aethercasa-bridge-addon-{arch}
